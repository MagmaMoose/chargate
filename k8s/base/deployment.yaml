# Chargate/KICS suppressions (reviewed false positives, not vulnerabilities).
# The same decisions are restated for Checkov in .checkov.yml and for Trivy in
# .trivyignore — neither reads `kics-scan disable=`. Keep the three in sync.
#   611ab018... `metadata.namespace is undefined` — kustomize base; the namespace
#     is set by the overlay (k8s/overlays/prod/kustomization.yaml: `namespace: chargate`).
#   7c81d34c... image lacks digest — the base pins a concrete released tag and
#     Flux ImagePolicy rewrites that *tag* on reconcile (see the overlay's
#     `images:` block). A digest is mutually exclusive with that automation;
#     provenance is covered by cosign signatures instead.
#   4a20ebac... / 48a5beba... no LimitRange / ResourceQuota — those are cluster-
#     namespace policies, not Deployment-level fields. Out of scope here.
#   3d658f8b... envFrom.secretRef is defined — this is the correct pattern: the
#     Secret is created by an ExternalSecret synced from OCI Vault (see
#     externalsecret.yaml). Inlining the values would be the actual vulnerability.
#
# Previously suppressed, now genuinely fixed — do NOT re-add:
#   02323c00 (low UID) — runAsUser/runAsGroup are 10001, matching the image's
#     APP_UID/APP_GID; 583053b7 (`latest` tag) — the base pins vX.Y.Z.
# kics-scan disable=611ab018-c4aa-4ba2-b0f6-a448337509a6,7c81d34c-8e5a-402b-9798-9f442630e678,4a20ebac-1060-4c81-95d1-1f7f620e983b,48a5beba-e4c0-4584-a2aa-e6894e4cf424,3d658f8b-d988-41a0-a841-40043121de1e
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chargate
  labels:
    app: chargate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chargate
  template:
    metadata:
      labels:
        app: chargate
      annotations:
        # AppArmor: confine the broker with the host's default runtime profile
        # (matches the seccompProfile RuntimeDefault below).
        container.apparmor.security.beta.kubernetes.io/chargate: runtime/default
    spec:
      # The broker never calls the k8s API — disable SA token mount.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric UID/GID so the kubelet can verify non-root (a name alone fails
        # the check). Must match the image's `app` user — see APP_UID/APP_GID in
        # broker/Dockerfile. Above 10000 so it cannot collide with a host account
        # (Checkov CKV_K8S_40, Trivy KSV-0020/KSV-0021).
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        # The token broker (FastAPI). Verifies a consumer's GitHub Actions OIDC
        # token and mints a repo-scoped Chargate App installation token so the
        # PR comment is authored by Chargate[bot].
        - name: chargate
          # A concrete released tag, not `latest`: the overlay's `images:` block is
          # what Flux's ImagePolicy rewrites on reconcile, so the base never needs
          # a floating tag (Checkov CKV_K8S_14, Trivy KSV-0013).
          image: ghcr.io/magmamoose/chargate:v2.9.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          # APP_ID / PRIVATE_KEY come from OCI Vault via the ExternalSecret.
          envFrom:
            - secretRef:
                name: chargate-broker
          env:
            # Must match the `oidc_audience` the consumer action requests.
            - name: OIDC_AUDIENCE
              value: "chargate"
            - name: GITHUB_API_URL
              value: "https://api.github.com"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Always
