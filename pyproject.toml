[project]
name = "chargate"
version = "2.11.2"
description = "Security + lint gate: a thin MegaLinter wrapper with net-new (PR-diff) finding gating."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Caleb Sargeant", email = "caleb@magmamoose.com" }]
keywords = ["security", "lint", "sarif", "megalinter", "gate", "defectdojo"]
# The core net-new filter is intentionally stdlib-only so it stays trivially
# testable and the package stays light. The DefectDojo client uses urllib too.
dependencies = []

[project.scripts]
chargate = "chargate.cli:main"

[project.urls]
Homepage = "https://github.com/MagmaMoose/chargate"
Source = "https://github.com/MagmaMoose/chargate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chargate"]

[dependency-groups]
# pytest-cov is required by the brimyr patch-coverage gate: it runs
# `pytest --cov --cov-report=xml`, which errors without the plugin.
dev = ["pytest>=8.0", "pytest-cov>=7.0", "ruff>=0.6"]
# Docs tooling (non-default group): `uv run --group docs mkdocs serve|build`.
docs = [
  "mkdocs-material>=9.5",
  # Transitive via mkdocs-material. Floor pinned so a future re-lock cannot
  # resolve back under GHSA-gm37-52c6-37mw (high: ReDoS in the caret/tilde/
  # betterem/magiclink inline processors) or GHSA-9xwg-3r6f-jcx2 (medium: path
  # traversal in the b64 extension), both fixed in 11.0.1.
  "pymdown-extensions>=11.0.1",
]
# The token-broker service under `broker/` is a separate deployable with its own
# deps — they are deliberately NOT runtime deps of the stdlib-only chargate CLI.
# It now carries its own `broker/pyproject.toml`, because pywrangler vendors a
# Worker's dependencies from the pyproject next to its wrangler.toml and the split
# between Worker-safe deps and the container's uvicorn has to live there. Listing
# them again here would be two sources of truth for one dependency set.
#   cd broker && uv sync --extra dev && uv run pytest

[tool.ruff]
line-length = 100
target-version = "py311"
# `broker` is absent on purpose: it is self-contained under broker/pyproject.toml,
# which ruff resolves per-file, and listing it here would sort its imports against
# this project's layout instead of its own.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

# python-semantic-release (driven by Diatreme on release; see
# .github/workflows/release.yml). PSR computes the next stable version from
# conventional commits since the last tag and writes it to BOTH locations below,
# so the hatchling package version and `chargate version` stay in lockstep — do
# not bump these by hand.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/chargate/__init__.py:__version__"]
build_command = ""          # version-only release: a git tag + GitHub Release, no PyPI build
major_on_zero = false
tag_format = "v{version}"
commit_message = "chore(release): v{version}"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false          # Diatreme controls prerelease via its inputs, not here

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore", "revert"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"
