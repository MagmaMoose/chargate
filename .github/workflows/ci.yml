name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: '3.12'
      - name: Sync
        run: uv sync
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q

  # The broker is a separate deployable with its own dependency set and its own
  # pyproject, so it gets its own job rather than being swept into the CLI's `uv sync`
  # — the CLI is deliberately stdlib-only and must stay installable without FastAPI.
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: '3.12'
      - name: Sync
        run: uv sync --extra dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      # Build the deployable artifact BEFORE pytest, because tests/test_lambda_package.py
      # inspects and (on this runner) executes it. Doing it here means a dependency bump
      # that resolves a wheel for the wrong platform, breaks the import, or blows the
      # size budget fails on the pull request rather than at deploy time — where the
      # symptom would be a cold-start ImportError on a fail-soft path, i.e. silence.
      #
      # The runner is ubuntu-latest/x86_64/py3.12, which is exactly the Lambda target,
      # so TestImportable actually executes the artifact here instead of skipping.
      - name: Build the Lambda zip
        run: uv run python scripts/build_lambda_zip.py --out ../dist/chargate-broker.zip --platform x86_64-manylinux_2_28
      - name: Pytest
        run: uv run pytest -q
