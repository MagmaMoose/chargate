# Publish the broker Lambda zip to S3, version-scoped and immutable.
#
# WHY THIS IS NOT IN release.yml, WHICH IS WHERE IT STARTED. `.github/workflows/release.yml` is
# provisioned centrally by caldrith ("chore: provision required workflows") and is overwritten
# in place — it has been rewritten four times in this repo's history. Publish wiring added there
# survives until the next provisioning run and then vanishes, taking the deployment path with it
# and leaving no trace in any PR. Chargate-specific logic has to live in a file caldrith does not
# own.
#
# It also removes a dependency that was silently costing us: diatreme's publish step is gated on
# `steps.normalize.outputs.released == 'true'`, so it only ever fires on the run that CREATES a
# tag. Any re-run, or any release whose version was already tagged, skipped the publish with no
# error. Keying on the tag itself is both simpler and re-runnable.

name: Publish broker artifact

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (defaults to the latest tag)'
        required: false
        default: ''
      force:
        description: 'Publish even if nothing under broker/ changed since the previous tag'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # OIDC assume-role; no AWS credential is stored in this repository

concurrency:
  # Never two uploads racing for one key. Not strictly required — the key is immutable and the
  # upload refuses to overwrite — but a second runner losing that race reports a confusing failure.
  group: publish-broker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags AND full history: the publish gate resolves the previous release with
          # `git describe`, which finds nothing on a shallow clone and would fail open.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Resolve the version and whether to publish
        id: plan
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force || false }}
          REF_NAME: ${{ github.ref_name }}
          HAVE_TARGET: ${{ vars.BROKER_ARTIFACT_BUCKET != '' && vars.BROKER_PUBLISH_ROLE_ARN != '' }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # THE PUBLISH GATE. Most chargate releases are CLI changes that touch nothing shipped;
          # without this the infra leaf collects a stream of version-bump PRs redeploying
          # byte-identical code until nobody reads them.
          #
          # Compare against the tag BEFORE this one — on a tag push HEAD is the tagged commit, so
          # the nearest tag is this release and the one before it is the baseline.
          previous="$(git describe --tags --abbrev=0 "v${version}^" 2>/dev/null || true)"
          if [ "${FORCE}" = "true" ] || [ -z "${previous}" ]; then
            changed=true
          else
            changed="$(cd broker && uv run python scripts/build_lambda_zip.py --changed-since "${previous}")"
            echo "Comparing v${version} against ${previous}: changed=${changed}"
          fi

          if [ "${HAVE_TARGET}" != "true" ]; then
            echo "::notice::BROKER_ARTIFACT_BUCKET / BROKER_PUBLISH_ROLE_ARN unset; not publishing"
            changed=false
          fi
          echo "publish=${changed}" >> "$GITHUB_OUTPUT"

      - name: Build the Lambda zip
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        env:
          ZIP_PATH: ${{ runner.temp }}/chargate-broker.zip
        run: |
          set -euo pipefail
          cd broker
          uv run python scripts/build_lambda_zip.py --out "${ZIP_PATH}" --platform x86_64-manylinux_2_28

      - name: Configure AWS credentials
        if: steps.plan.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.BROKER_PUBLISH_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload, refusing to overwrite
        if: steps.plan.outputs.publish == 'true'
        shell: bash
        env:
          BUCKET: ${{ vars.BROKER_ARTIFACT_BUCKET }}
          VERSION: ${{ steps.plan.outputs.version }}
          ZIP_PATH: ${{ runner.temp }}/chargate-broker.zip
        run: |
          set -euo pipefail
          key="broker/${VERSION}.zip"

          # IMMUTABLE BY REFUSAL. The infra leaf pins this key, so replacing its bytes would swap
          # the running code under a version somebody already reviewed. An existing key means the
          # version was already published and a re-run is a no-op that reports success.
          #
          # The role needs s3:ListBucket as well as s3:GetObject for this check: without
          # ListBucket, S3 answers a HEAD on a MISSING key with 403 rather than 404, because it
          # will not confirm non-existence to a caller who cannot list. The first publish of any
          # prefix hits exactly that.
          if aws s3api head-object --bucket "${BUCKET}" --key "${key}" >/dev/null 2>&1; then
            echo "s3://${BUCKET}/${key} already published — nothing to do."
            exit 0
          fi

          aws s3api put-object \
            --bucket "${BUCKET}" \
            --key "${key}" \
            --body "${ZIP_PATH}" \
            --checksum-algorithm SHA256 >/dev/null

          digest="$(sha256sum "${ZIP_PATH}" | cut -d' ' -f1)"
          {
            echo "### Broker artifact published"
            echo
            echo "\`s3://${BUCKET}/${key}\`"
            echo
            echo "sha256 \`${digest}\`"
            echo
            echo "Deploy it by bumping this line in \`magmamoose/infra\`:"
            echo
            echo '```hcl'
            echo '# terraform/aws/chargate/prod/eu-west-1/chargate-broker/terragrunt.hcl'
            echo "broker_artifact_version = \"${VERSION}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
