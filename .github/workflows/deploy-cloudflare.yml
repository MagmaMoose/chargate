name: Deploy Cloudflare Worker

# The token broker runs as a Cloudflare Python Worker. The container image under
# broker/Dockerfile is still built by release.yml and remains a supported target;
# this workflow is the edge one.
#
# Deliberately NO pull-request preview, unlike platform2's console. `versions upload
# --preview-alias` publishes a publicly reachable URL that inherits the Worker's real
# secrets — for a service whose whole job is minting GitHub App installation tokens
# that is a second front door to the token minter, outside whatever WAF rules are
# bound to the production hostname. A pull request instead builds the exact bundle
# with `--dry-run`, which catches the failure mode that actually bites here
# (a dependency with no wasm32 wheel) without uploading anything.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Required Worker secrets, set once out of band (see broker/wrangler.toml):
#   wrangler secret put APP_ID
#   wrangler secret put PRIVATE_KEY < chargate-app.private-key.pem

on:
  push:
    branches:
      - main
    paths:
      - 'broker/**'
      - '.github/workflows/deploy-cloudflare.yml'
  pull_request:
    paths:
      - 'broker/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  # Pinned so a Wrangler minor release cannot change deploy behaviour between an
  # unchanged commit and its redeploy.
  WRANGLER_VERSION: '4.42.0'
  # Wrangler 4.x requires Node >= 22. Pinned to 24 rather than latest: pywrangler
  # resolves the Pyodide interpreter through a node shim that still passes
  # --experimental-wasm-stack-switching, which Node 26 rejects outright.
  NODE_VERSION: '24'
  # pywrangler resolves and vendors the Worker's dependencies; pinned for the same
  # reason as Wrangler, since it decides which wheels end up in the bundle.
  WORKERS_PY_VERSION: '1.16.1'
  UV_VERSION: '0.11.21'
  BROKER_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME || 'chargate.magmamoose.com' }}

jobs:
  deploy:
    name: deploy
    runs-on: ${{ vars.SELFHOSTED_GITHUB_RUNNER || 'ubuntu-latest' }}
    # Only a real deploy touches the production environment; a pull request only
    # builds, so it must not queue behind an approval gate.
    environment: ${{ github.event_name == 'push' && 'production' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve deployment
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          # Only ever tested for emptiness — never echoed, never passed to a command.
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "push" ] && [ "${HAVE_TOKEN}" != "true" ]; then
            # Cloudflare is not wired up yet. Failing here would leave a permanently
            # red check over a repository setting, which tells nobody anything about
            # the change under review. Skip loudly instead.
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is unset; skipping deploy"
          elif [ "${EVENT}" = "push" ]; then
            echo "mode=production" >> "$GITHUB_OUTPUT"
          else
            # A build needs no credentials at all, so it runs on fork pull requests too.
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi
          echo "Broker: https://${BROKER_HOSTNAME}"

      - if: steps.plan.outputs.mode != 'skip'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        if: steps.plan.outputs.mode != 'skip'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      # `sync` then prune then plain `wrangler`, rather than `pywrangler deploy`.
      #
      # Plain wrangler alone uploads the source and nothing else, so the Worker starts
      # with only the Python standard library and dies on the first third-party import
      # (`ModuleNotFoundError: No module named 'pydantic'`). pywrangler reads
      # broker/pyproject.toml, resolves it against the Pyodide build implied by
      # compatibility_date, and vendors the wheels into python_modules/.
      #
      # The prune is not optional: wrangler bundles *every* file in the working
      # directory and honours neither .wranglerignore nor a rules exclusion for Python,
      # so the resolution virtualenvs and the test suite would otherwise ship to
      # production — and .venv holds host-native wheels that cannot run on wasm32.
      - name: Vendor dependencies
        if: steps.plan.outputs.mode != 'skip'
        working-directory: broker
        run: |
          set -euo pipefail
          uv run --with workers-py==${{ env.WORKERS_PY_VERSION }} pywrangler sync
          rm -rf .venv .venv-workers tests

      - name: Build the bundle
        if: steps.plan.outputs.mode == 'build'
        working-directory: broker
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run --outdir dist
          echo "::notice::Bundle built. Check the gzip total above against the script-size"
          echo "::notice::ceiling: 3 MB on Workers Free, 10 MB on Workers Paid."

      - name: Deploy
        if: steps.plan.outputs.mode == 'production'
        working-directory: broker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} \
            deploy --routes "${{ env.BROKER_HOSTNAME }}/*"
