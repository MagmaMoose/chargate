name: Security

# Chargate/KICS suppression (reviewed false positive, not a vulnerability):
#   baee238e... Passwords And Secrets - Generic Token misfires on the required
#   `id-token: write` GitHub OIDC permission key below — no secret is present.
# kics-scan disable=baee238e-1921-4801-9c3f-79ae1d7b2cbc
#
# Chargate eats its own dog food by consuming the LOCAL composite action
# (./action.yml at THIS commit) — the same thing an external repo gets from
#   uses: magmamoose/chargate@v2
# so every run exercises the action under test. The only extra line vs. an
# external consumer is the checkout: a local `uses: ./` needs the repo present
# first, whereas `magmamoose/chargate@v2` checks the consumer out itself.
#
# Each sink is active iff its host URL is set — no separate on/off toggle. With
# product / engagement / project all defaulting to the repo, a consumer wiring a
# sink supplies only the URL + credential (the MM_* names are this repo's vars).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly re-probe of the standalone-image table against the live registry (see the
    # megalinter-image-table job). A MegaLinter release that drops a linter or loses an
    # arm64 build must fail here, not as an arm64 scan that quietly got smaller.
    - cron: '17 6 * * 1'

permissions:
  contents: read
  pull-requests: write     # Chargate posts net-new findings as PR comments
  security-events: write   # full SARIF -> GitHub Security tab
  # kics-scan ignore-line
  id-token: write          # OIDC exchange at the broker -> comment as Chargate[bot]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chargate:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      # Local `uses: ./` needs action.yml present; net-new needs full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Mint a token from the "Chargate" GitHub App so PR comments are authored by
      # Chargate[bot] (not github-actions[bot]). Skipped when the app isn't
      # configured, in which case pr_comment_token is empty and the action falls
      # back to GITHUB_TOKEN. The app only needs Pull requests: write.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: ${{ vars.MM_CHARGATE_APP_ID != '' }}
        with:
          app-id: ${{ vars.MM_CHARGATE_APP_ID }}
          private-key: ${{ secrets.MM_CHARGATE_APP_PRIVATE_KEY }}
      - uses: ./
        with:
          checkout: 'false'   # already checked out above with full history
          # Author PR comments as Chargate[bot] when the app is configured; the
          # Security-tab upload keeps using the default github_token.
          pr_comment_token: ${{ steps.app-token.outputs.token }}
          # A runs-less SARIF already fails on its own, for every consumer. This adds the
          # other half: any MegaLinter tool error fails chargate's own dogfood run too,
          # so a linter that stops working here is not quietly tolerated.
          strict: 'true'
          # DefectDojo — full-SARIF sink. product / product_type / engagement
          # default to the repo name / "Research and Development" / "ci".
          defectdojo_url: ${{ vars.MM_DEFECTDOJO_URL }}
          defectdojo_token: ${{ secrets.MM_DEFECTDOJO_API_KEY }}
          # Dependency-Track — CycloneDX BOM sink. project name/version default to
          # the repo and ref.
          dependency_track_url: ${{ vars.MM_DEPENDENCYTRACK_URL }}
          dependency_track_api_key: ${{ secrets.MM_DEPENDENCYTRACK_API_KEY }}

  # The arm64 half of the same dogfood. `MagmaMoose/chargate` is public, so the free
  # GitHub-hosted arm64 runner is available — which means the arm64 path is exercised
  # on every PR rather than being a code path nobody has ever executed.
  #
  # It deliberately does NOT comment on the PR or upload to the Security tab: the amd64
  # job owns the PR thread and the inventory. Its whole job is to prove the standalone
  # substitution produces a real, non-empty SARIF.
  chargate-arm64:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04-arm
    # Standalone mode pulls ~2.3 GB deduped and starts 18 containers (4 at a time), so
    # it is legitimately slower than the single-image amd64 job — but not unbounded.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./
        id: gate
        with:
          checkout: 'false'
          pr_comment: 'false'
          upload_github_sarif: 'false'
          sarif_artifact_name: chargate-sarif-arm64
      # The assertion that would have caught the empty-gate bug: a SARIF that MegaLinter
      # (or chargate's merge of MegaLinter reports) actually wrote, carrying real runs
      # with real driver names. A stray per-linter file has no `properties.comment`, and
      # a scan that ran nothing has no runs.
      - name: Assert the arm64 scan produced a real SARIF
        # always(): a legitimately blocking gate must not skip the proof — an empty
        # SARIF and a clean one are indistinguishable from the gate's exit code alone.
        if: ${{ always() && steps.gate.outputs.sarif_path != '' }}
        shell: bash
        env:
          SARIF_PATH: ${{ steps.gate.outputs.sarif_path }}
          SCAN_MODE: ${{ steps.gate.outputs.scan_mode }}
        run: |
          set -euo pipefail
          [ "$SCAN_MODE" = "standalone" ] || {
            echo "::error::expected the arm64 runner to take the standalone path, got '$SCAN_MODE'"
            exit 1
          }
          python3 - "$SARIF_PATH" <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          comment = (doc.get("properties") or {}).get("comment", "")
          runs = doc.get("runs") or []
          drivers = [((r.get("tool") or {}).get("driver") or {}).get("name") for r in runs]
          print(f"comment={comment!r} runs={len(runs)} drivers={drivers}")
          assert comment.startswith(("Generated by MegaLinter", "Merged by chargate")), comment
          assert runs, "SARIF has no runs — the scan produced nothing"
          assert any(drivers), "SARIF runs carry no tool.driver.name"
          PY

  # Re-probe every standalone image against ghcr.io: weekly on the schedule, AND on any
  # PR that edits the table itself.
  #
  # That second half used to be a comment only — the job was `if: github.event_name ==
  # 'schedule'`, so the single change most likely to invalidate the table (editing it)
  # was the one change that never checked it. Same shape as the bug this repo is fixing:
  # a guard that reads as armed and never fires. `on.pull_request.paths` cannot express
  # "this job only", so the paths test is a step, and everything expensive hangs off it —
  # an unrelated PR spends ~15s deciding to do nothing and never touches the network, so
  # normal CI stays offline and fast.
  megalinter-image-table:
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # base...HEAD below needs both sides present
      - name: Does this event touch the standalone-image table?
        id: probe
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The table lives in linters.py; the probe itself lives in the registry test.
          if git diff --name-only "$BASE_SHA...HEAD" \
             | grep -qxE 'src/chargate/linters\.py|tests/test_linters_registry\.py'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "standalone-image table unchanged — skipping the live registry probe"
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: ${{ steps.probe.outputs.run == 'true' }}
        with:
          python-version: '3.12'
      - if: ${{ steps.probe.outputs.run == 'true' }}
        run: uv sync
      - name: Verify the standalone-image table against ghcr.io
        if: ${{ steps.probe.outputs.run == 'true' }}
        env:
          CHARGATE_REGISTRY_TESTS: '1'
        run: uv run pytest tests/test_linters_registry.py -q
