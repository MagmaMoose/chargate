# Checkov config (MegaLinter REPOSITORY_CHECKOV).
#
# Reviewed false positives on the kustomize BASE under k8s/base. Each of these is
# already recorded as a KICS suppression in the manifest it applies to; Checkov
# doesn't read `kics-scan disable=` comments, so the same decisions are restated
# here in its own dialect. Anything NOT listed still gates.
#
# Deliberately narrow: these are skipped repo-wide because k8s/base is the only
# Kubernetes content in the repo. Adding more manifests means revisiting this list.
skip-check:
  # The default namespace should not be used (deployment/service/ingress/
  # ghcr-pull-secret). This is a kustomize base — `metadata.namespace` is
  # intentionally absent and set by the overlay
  # (k8s/overlays/prod/kustomization.yaml: `namespace: chargate`). Hardcoding it in
  # the base would defeat the overlay pattern and break any future non-prod overlay.
  - CKV_K8S_21

  # Image should use digest. The base pins a concrete released tag
  # (ghcr.io/magmamoose/chargate:vX.Y.Z) and Flux's ImagePolicy rewrites that *tag*
  # on reconcile — see the overlay's `images:` block and its `$imagepolicy` marker.
  # A `@sha256:` digest is mutually exclusive with tag-based ImagePolicy automation,
  # so this is a deliberate trade: automated patch rollout over digest pinning.
  # Provenance is covered instead by cosign signatures (Diatreme image-sign).
  - CKV_K8S_43

  # Prefer using secrets as files over secrets as environment variables. APP_ID /
  # PRIVATE_KEY reach the broker via `envFrom.secretRef` from a Secret that an
  # ExternalSecret syncs out of OCI Vault (k8s/base/externalsecret.yaml). The
  # secret is never in git, which is the risk the rule actually targets; switching
  # to a projected file mount would mean the app re-reading config from disk with
  # no change to the blast radius.
  - CKV_K8S_35
